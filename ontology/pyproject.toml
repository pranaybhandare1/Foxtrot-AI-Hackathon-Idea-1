[project]
name = "t1d-ontology"
version = "0.1.0"
description = "The t1d ontology: YAML model, validation against backing datasets, DuckDB publishing, OSDK-style client"
requires-python = ">=3.12"
dependencies = ["t1d-core", "polars>=1.44", "duckdb>=1.5", "pyarrow>=21", "pyyaml>=6.0"]

[tool.uv.sources]
t1d-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
